<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Butter</title><style>html[data-theme=dark]{color-scheme:dark;--bg:#0d0b07;--page:#060503;--side:#120f09;--card:#181409;--ink:#ebe0c3;--muted:#968b6a;--line:#271f10;--acc:#cf9a12;--acc2:#e0ad26;--onacc:#150f02;--user:#201a0b;--userink:#ebe0c3;--userbd:#382d15;--ok:#8bd48f;--shadow:0 12px 44px rgba(0,0,0,.6);--r:24px;--r2:14px;--pill:999px;--hf:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--glow:radial-gradient(520px 260px at 50% 0,rgba(207,154,18,.11),transparent 72%)}
html[data-theme=light]{color-scheme:light;--bg:#fbf6e7;--page:#e8dfc4;--side:#f3ebd3;--card:#fffdf5;--ink:#2a2008;--muted:#7b6d45;--line:#e4d7ab;--acc:#d6a01a;--acc2:#c58f0b;--onacc:#241a03;--user:#f3dc8f;--userink:#2a2008;--userbd:#e6cf7a;--ok:#2e7d32;--shadow:0 10px 36px rgba(110,80,0,.16);--r:24px;--r2:14px;--pill:999px;--hf:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--glow:radial-gradient(520px 260px at 50% 0,rgba(214,160,26,.18),transparent 72%)}
html[data-theme=simple]{color-scheme:light;--bg:#fff;--page:#fff;--side:#fff;--card:#fff;--ink:#111;--muted:#707070;--line:#e5e5e5;--acc:#111;--acc2:#3a3a3a;--onacc:#fff;--user:#f2f2f2;--userink:#111;--userbd:transparent;--ok:#1a7f37;--shadow:none;--r:6px;--r2:4px;--pill:6px;--hf:"Helvetica Neue",Helvetica,Arial,sans-serif;--glow:none}
html[data-theme=simpledark]{color-scheme:dark;--bg:#0c0c0c;--page:#0c0c0c;--side:#0c0c0c;--card:#0c0c0c;--ink:#f2f2f2;--muted:#8a8a8a;--line:#262626;--acc:#f2f2f2;--acc2:#cfcfcf;--onacc:#0c0c0c;--user:#1a1a1a;--userink:#f2f2f2;--userbd:transparent;--ok:#5bd17a;--shadow:none;--r:6px;--r2:4px;--pill:6px;--hf:"Helvetica Neue",Helvetica,Arial,sans-serif;--glow:none}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%;margin:0}
body{background:var(--page);color:var(--ink);font:16px/1.65 -apple-system,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background-color .4s,color .4s}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;height:100%}
aside{width:276px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:12px;padding:16px;transition:background-color .4s,border-color .4s,transform .35s cubic-bezier(.2,.8,.2,1)}
.brand{display:flex;align-items:center;gap:10px;font:700 27px var(--hf);letter-spacing:-.3px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg);border:1px solid var(--line);border-radius:var(--r2);padding:3px;gap:2px}
.tab{border:0;background:none;padding:8px 4px;border-radius:calc(var(--r2) - 3px);cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;transition:background-color .25s,color .25s}
.tab.on{background:var(--acc);color:var(--onacc)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--acc);color:var(--onacc);border:1px solid transparent;border-radius:var(--pill);padding:10px 18px;font-weight:650;cursor:pointer;transition:transform .15s,background-color .2s,box-shadow .2s}
.btn:hover{background:var(--acc2)}.btn:active{transform:scale(.97)}
.btn.ghost{background:none;border-color:var(--line);color:var(--ink);font-weight:500}.btn.ghost:hover{background:var(--card)}
.btn.wide{width:100%}
.icon{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:50%;background:none;color:var(--muted);cursor:pointer;transition:background-color .2s,color .2s,transform .15s;flex:none}
.icon:hover{background:var(--card);color:var(--ink)}.icon:active{transform:scale(.92)}.icon.sm{width:28px;height:28px}
.ic{width:20px;height:20px}.btn .ic{width:18px;height:18px}
input[type=search],input[type=password],input[type=text],select,dialog textarea{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px;width:100%;outline:none;transition:border-color .2s}
input:focus,select:focus,dialog textarea:focus{border-color:var(--acc)}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px;margin:0 -6px;padding:0 6px}
.ci{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 12px;border-radius:var(--r2);cursor:pointer;transition:background-color .2s}
.ci .ct{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ci button{opacity:0}.ci:hover button,.ci.on button{opacity:1}
.ci:hover,.ci.on{background:var(--bg)}
.foot{display:flex;align-items:center;gap:4px}
.chip{flex:1;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:var(--pill);padding:6px 12px;font-size:13px;cursor:pointer;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:all .2s}
.chip.ok{color:var(--ok);border-color:var(--ok)}.chip.need{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:600}.chip.warn{color:#d64545;border-color:#d64545}
main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;background:var(--bg);transition:background-color .4s}
main::before{content:"";position:absolute;inset:0 0 auto 0;height:320px;background:var(--glow);pointer-events:none}
section{flex:1;display:none;flex-direction:column;min-height:0;position:relative}section.on{display:flex}
#burger{display:none;position:absolute;top:10px;left:10px;z-index:4}
#pbar{display:none;position:absolute;top:0;left:0;right:0;z-index:6;background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px 8px;font-size:13px;color:var(--muted)}
#pbar.on{display:block}#pbar i{display:block;height:5px;border-radius:5px;background:var(--acc);width:0;margin-bottom:6px;transition:width .35s ease}
#log{flex:1;overflow:auto;padding:30px 20px 10px}
.msg{max-width:760px;margin:0 auto 24px;animation:in .4s cubic-bezier(.2,.8,.2,1)}
.msg.user{display:flex;justify-content:flex-end}
.ub{background:var(--user);color:var(--userink);border:1px solid var(--userbd);padding:10px 16px;border-radius:var(--r) var(--r) 6px var(--r);max-width:82%;white-space:pre-wrap;word-break:break-word}
.msg.bot{display:flex;gap:14px}.av{flex:none;width:34px;height:34px}.body{flex:1;min-width:0}
.txt{word-break:break-word}.tt{color:var(--muted);transition:opacity .22s;padding-top:5px}.tt.fade{opacity:0}
.txt h3,.txt h4{margin:.9em 0 .2em;line-height:1.3;font-family:var(--hf)}.txt ul,.txt ol{margin:.4em 0;padding-left:1.3em}
.txt code{background:var(--side);padding:.1em .38em;border-radius:6px;font:.9em ui-monospace,Consolas,monospace}
.code{position:relative;margin:.7em 0}.code pre{margin:0;background:var(--side);border:1px solid var(--line);border-radius:var(--r2);padding:14px;overflow:auto;font:14px/1.55 ui-monospace,Consolas,monospace}
.cp{position:absolute;top:8px;right:8px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:2px 10px;font-size:12px;cursor:pointer}
.acts{display:flex;gap:4px;margin-top:6px}.acts button,.linkbtn{border:0;background:none;color:var(--muted);font-size:13px;padding:4px 8px;border-radius:8px;cursor:pointer;transition:background-color .2s,color .2s;text-decoration:none}
.acts button:hover,.linkbtn:hover{background:var(--card);color:var(--ink)}
.caret{display:inline-block;width:.5em;height:1em;vertical-align:-2px;background:var(--acc);border-radius:2px;margin-left:2px;animation:bl 1s steps(2) infinite}
.hi{max-width:640px;margin:8vh auto 0;text-align:center;color:var(--muted);position:relative}.hi h2{color:var(--ink);font:700 32px var(--hf);margin:12px 0 4px;letter-spacing:-.4px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.card{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;color:var(--ink);transition:transform .25s,box-shadow .25s,border-color .25s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--acc)}
.composer{max-width:760px;width:100%;margin:0 auto;padding:6px 20px 20px;position:relative}
body.priv .composer::before{content:"Private chat · saved only in your vault, encrypted";display:block;font-size:12px;color:var(--muted);margin:0 8px 6px}
.box2{display:flex;align-items:flex-end;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px;box-shadow:var(--shadow);transition:border-color .2s}
body.priv .box2{border-style:dashed}.box2:focus-within{border-color:var(--acc)}
.box2 textarea{flex:1;border:0;background:none;resize:none;outline:none;max-height:160px;padding:9px 6px}
.icon.go{background:var(--acc);color:var(--onacc)}.icon.go:hover{background:var(--acc2);color:var(--onacc)}
.icon.on{background:#ffd9d6;color:#b3261e;animation:pulse 1.2s ease-in-out infinite}
.chipA{border:1px solid var(--line);background:var(--card);border-radius:var(--pill);padding:4px 12px;font-size:13px;margin:0 0 8px;cursor:pointer;color:var(--muted)}
.box{max-width:860px;width:100%;margin:0 auto;padding:30px 20px;overflow:auto;position:relative}
.lock{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:8vh;text-align:center}.lock h2,.dh{font:700 28px var(--hf);margin:0;letter-spacing:-.3px}.lock input{max-width:300px}.lock p{max-width:380px;margin:0}
.meter{width:100%;max-width:300px;height:6px;background:var(--line);border-radius:6px;overflow:hidden}.meter i{display:block;height:100%;width:0;transition:width .3s,background-color .3s}
.vhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.vseg{display:flex;gap:4px;background:var(--side);border:1px solid var(--line);border-radius:var(--pill);padding:4px;margin-right:auto;flex-wrap:wrap}
.vseg button{border:0;background:none;padding:7px 14px;border-radius:var(--pill);cursor:pointer;color:var(--muted);font-weight:600;transition:background-color .2s,color .2s}
.vseg .on{background:var(--acc);color:var(--onacc)}.vseg small{opacity:.7;margin-left:3px}
.vtop{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pgrid button{padding:0;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;aspect-ratio:1;cursor:pointer;background:var(--side);color:var(--muted);font-size:12px;transition:transform .2s}.pgrid button:hover{transform:scale(1.03)}.pgrid img{width:100%;height:100%;object-fit:cover;display:block}
.vid{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:10px 14px;margin-bottom:8px}.vid b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recbar{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:10px 14px}
.dot{width:10px;height:10px;border-radius:50%;background:#e5484d;animation:pulse 1.2s ease-in-out infinite}
#pl{margin-bottom:14px}#pl video,#pl img{width:100%;max-height:60vh;object-fit:contain;background:#000;border-radius:var(--r2);display:block;margin-bottom:10px}#pl audio{width:100%;margin-bottom:10px}
.row2{display:flex;gap:8px;flex-wrap:wrap}.err{color:#d64545;min-height:1.4em}.small{color:var(--muted);font-size:14px}
.dh2{margin:28px 0 10px;color:var(--muted);font-size:15px}.dbar{display:flex;gap:10px;margin-top:14px}.dbar input{flex:1}
.dstage{margin:16px 0;min-height:340px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.dstage img{width:min(420px,100%);aspect-ratio:1;border-radius:var(--r2);animation:in .45s cubic-bezier(.2,.8,.2,1)}
.think{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.gal button{border:1px solid var(--line);background:var(--card);border-radius:var(--r2);padding:4px;cursor:pointer;transition:transform .2s,box-shadow .2s}.gal button:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.gal img{width:100%;aspect-ratio:1;border-radius:calc(var(--r2) - 3px);display:block}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink);padding:24px;width:min(500px,92vw);box-shadow:var(--shadow);max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.5)}.dform{display:flex;flex-direction:column;gap:12px}.dform h3{margin:0;font:700 22px var(--hf)}
.dform label{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--muted)}.dform label.chk{flex-direction:row;align-items:center;gap:8px}
.dform textarea{height:70px;resize:vertical}.dform .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.dform input[type=range]{accent-color:var(--acc)}
.tcards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tcard{border:2px solid var(--line);border-radius:14px;padding:6px;line-height:1.25;background:var(--card);cursor:pointer;text-align:center;font-size:13px;color:var(--ink);transition:border-color .2s,transform .2s}.tcard:hover{transform:translateY(-2px)}.tcard.on{border-color:var(--acc)}
.tcard i{display:block;height:50px;border-radius:8px;margin-bottom:6px;border:1px solid rgba(128,128,128,.3)}
.tcard[data-t=dark] i{background:linear-gradient(#f2b52b,#f2b52b) 62% 72%/30% 12% no-repeat,linear-gradient(90deg,#2a2314 28%,#12100c 28%)}
.tcard[data-t=light] i{background:linear-gradient(#efb42a,#efb42a) 62% 72%/30% 12% no-repeat,linear-gradient(90deg,#f3ebd2 28%,#fbf6e9 28%)}
.tcard[data-t=simple] i{background:linear-gradient(#111,#111) 62% 72%/30% 12% no-repeat,#fff}
.tcard[data-t=simpledark] i{background:linear-gradient(#f2f2f2,#f2f2f2) 62% 72%/30% 12% no-repeat,#0c0c0c}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:var(--pill);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:20;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* ---- DARK and LIGHT share one look: floating panels, serif headings, soft glow ---- */
html[data-theme=dark] #app,html[data-theme=light] #app{padding:12px;gap:12px}
html[data-theme=dark] aside,html[data-theme=light] aside{border:1px solid var(--line);border-radius:28px}
html[data-theme=dark] main,html[data-theme=light] main{border:1px solid var(--line);border-radius:28px;overflow:hidden}
html[data-theme=dark] .msg.user .ub{box-shadow:0 2px 12px rgba(0,0,0,.25)}
html[data-theme=dark] .hi .logo{filter:drop-shadow(0 0 28px rgba(207,154,18,.35))}
html[data-theme=light] .hi .logo{filter:drop-shadow(0 0 24px rgba(214,160,26,.4))}
/* ---- SIMPLE: plain, square, no decoration ---- */
html[data-theme^=simple] aside{width:232px;padding:20px 16px}
html[data-theme^=simple] .brand{font-size:19px;font-weight:600;letter-spacing:.2px}
html[data-theme^=simple] .logo{filter:grayscale(1)}
html[data-theme^=simple] .brand .logo{width:24px;height:24px}
html[data-theme^=simple] .seg{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:0}
html[data-theme^=simple] .tab{border-radius:0;font-weight:500}html[data-theme^=simple] .tab.on{background:none;color:var(--ink);box-shadow:inset 0 -2px var(--ink)}
html[data-theme^=simple] .av{display:none}
html[data-theme^=simple] .msg.bot .body{border-left:2px solid var(--ink);padding-left:16px}
html[data-theme^=simple] .ub{border-radius:var(--r)}
html[data-theme^=simple] .box2,html[data-theme^=simple] .card,html[data-theme^=simple] .dstage{box-shadow:none}
html[data-theme^=simple] .card:hover,html[data-theme^=simple] .gal button:hover{transform:none;box-shadow:none;border-color:var(--ink)}
html[data-theme^=simple] .msg,html[data-theme^=simple] .dstage img{animation:none}
html[data-theme^=simple] .hi h2{font-size:24px;font-weight:600}
html[data-theme^=simple] .tt{animation:fade2 1.6s ease-in-out infinite}
html[data-theme^=simple] .caret{background:var(--ink);border-radius:0}
html[data-theme^=simple] .ci.on{box-shadow:inset 2px 0 var(--ink)}
html[data-theme^=simple] .icon.go{border-radius:var(--r2)}
.logo{display:block;overflow:visible}
.logo .pat,.logo .steam path,.logo .dr,.logo .pu,.logo .sh{transform-box:fill-box;transform-origin:50% 100%}
.logo .steam,.logo .steam path{opacity:0}.logo .dr{transform-origin:50% 0}
.cook .pat{animation:bob 1.8s cubic-bezier(.45,0,.55,1) infinite}
.cook .steam{opacity:1}.cook .steam path{animation:rise 1.8s ease-in-out infinite}
.cook .s2{animation-delay:.3s!important}.cook .s3{animation-delay:.6s!important}
.melt .pat{animation:soft 2.6s ease-in-out infinite}.melt .pu{animation:spread 2.6s ease-in-out infinite}.melt .dr{animation:drip 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-4px) scale(.97,1.05)}}
@keyframes rise{0%{opacity:0;transform:translateY(8px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-8px)}}
@keyframes soft{0%,100%{transform:scale(1,1)}50%{transform:scale(1.05,.9)}}
@keyframes spread{0%,100%{opacity:.15;transform:scaleX(.5)}50%{opacity:.95;transform:scaleX(1.05)}}
@keyframes drip{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1.3)}}
@keyframes in{from{opacity:0;transform:translateY(10px)}}@keyframes bl{50%{opacity:0}}@keyframes pulse{50%{transform:scale(1.1)}}@keyframes fade2{50%{opacity:.35}}
@media(max-width:760px){html[data-theme=dark] #app,html[data-theme=light] #app{padding:0;gap:0}html[data-theme=dark] aside,html[data-theme=dark] main,html[data-theme=light] aside,html[data-theme=light] main{border-radius:0;border:0}aside{position:fixed;inset:0 auto 0 0;z-index:10;transform:translateX(-102%)}aside.open{transform:none;box-shadow:12px 0 40px rgba(0,0,0,.3)}#burger{display:grid}.cards{grid-template-columns:1fr}#log{padding-top:56px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

.tools{display:flex;gap:8px;align-items:center;margin:0 0 8px;flex-wrap:wrap}
.mseg{display:flex;background:var(--side);border:1px solid var(--line);border-radius:var(--pill);padding:3px}
.mseg button{border:0;background:none;padding:4px 12px;border-radius:var(--pill);cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;transition:background-color .2s,color .2s}
.mseg .on{background:var(--acc);color:var(--onacc)}
.netbtn{border:1px solid var(--line);background:var(--card);border-radius:var(--pill);padding:4px 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;color:var(--muted);transition:all .2s}
#litebtn{margin-left:auto}.ndot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.netbtn.on{border-color:var(--ok);color:var(--ok)}.netbtn.on .ndot{background:var(--ok);box-shadow:0 0 0 4px rgba(63,185,80,.2);animation:pulse 1.6s ease-in-out infinite}
#litebtn.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.srcs{font-size:13px;color:var(--muted);margin-top:8px}.srcs a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--acc);text-underline-offset:3px}
html.lite .av,html.lite .hi .logo,html.lite .brand .logo,html.lite .lock .logo{display:none}
html.lite *{animation:none!important;transition:none!important}
html.lite main::before{display:none}
html.lite .box2,html.lite .card,html.lite .dstage,html.lite aside,html.lite .msg.bot .body{box-shadow:none!important}
html.lite .hi{margin-top:6vh}

.gtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;flex:none}.gtabs[hidden]{display:none}
.gt{border:1px solid var(--line);background:none;border-radius:var(--pill);padding:3px 11px;font-size:13px;white-space:nowrap;cursor:pointer;color:var(--muted);transition:background-color .2s,color .2s}
.gt:hover{color:var(--ink)}.gt.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.ci em{font-style:normal;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:var(--pill);padding:0 7px}
.menu{position:fixed;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--shadow);padding:6px;min-width:180px;animation:in .2s ease}

<script>const $=id=>document.getElementById(id),esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const PERSIST=new Set(['butter-set','butter-chats','butter-groups','butter-learned','butter-theme','butter-mode','butter-lite','butter-learn-ok']);

const mem={};const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return mem[k]||null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){mem[k]=v}if(PERSIST.has(k))touch()},del:k=>{try{localStorage.removeItem(k)}catch(e){delete mem[k]}if(PERSIST.has(k))touch()}};
function touch(){if(restoring||booting)return;const n=String(Date.now());try{localStorage.setItem('butter-savedAt',n)}catch(e){mem['butter-savedAt']=n}clearTimeout(flushT);flushT=setTimeout(flushData,900)}
const NOTES=[{"f": "coding_python_lua.md", "t": "# Python\nprint(\"Hello\"); name = input(\"Name? \"); numbers = [1, 2, 3]; person = {\"name\": \"Sam\", \"age\": 12}\nLoops: for i in range(5): print(i)   |   while x < 10: x += 1\nIf: if age >= 13: ... elif age >= 10: ... else: ...\nFunction: def add(a, b): return a + b\nLists: append(), len(), sorting with sorted(). Strings: f\"Hello {name}\". Files: with open(\"a.txt\") as f: text = f.read()\nClasses: class Dog: def __init__(self, name): self.name = name\nErrors: SyntaxError (typo, missing colon), IndentationError (spacing), NameError (unknown variable), TypeError (wrong type), IndexError (list position too big). Read the last line of the error message first. Use try/except to handle errors. Install packages with pip install name. Practice ideas: number guessing game, to-do list, calculator, quiz.\n# Lua (Roblox uses Luau, a version of Lua)\nlocal x = 5; print(\"hi\"); if x > 3 then ... elseif ... else ... end; for i = 1, 10 do ... end; while cond do ... end\nTables: local t = {1,2,3}; t[1] is the FIRST item (Lua counts from 1). #t is the length. Dictionaries: local p = {name = \"Sam\"}; p.name\nFunctions: local function add(a, b) return a + b end. Comparison: == equal, ~= not equal. Concatenate with .. (\"a\" .. \"b\").\n# General coding advice\nBreak problems into small steps, test often, name things clearly, read error messages, search the exact error text, comment tricky code, keep backups. Never run code from strangers without understanding it.\n"}, {"f": "economics.md", "t": "# Economics basics\nEconomics is the study of how people, businesses and governments choose to use limited resources to meet unlimited wants.\n\n## Scarcity, choice and opportunity cost\nScarcity: resources are limited but wants are unlimited, so we must choose. Opportunity cost: the value of the NEXT BEST alternative you give up when you make a choice. It is not the total of all alternatives, only the best one given up.\nExample: you have 2 hours. You can play a game, do homework or work for $10/hour. You choose the game. The opportunity cost is the next best option (for example earning $20 working). Example 2: a farmer can grow 100 kg wheat or 80 kg corn on a field. Choosing wheat costs 80 kg of corn. The opportunity cost of 1 kg wheat = 0.8 kg corn.\nHow to solve: (1) list the options, (2) choose the best, (3) the opportunity cost is the best option you did NOT pick.\n\n## Demand and supply\nLaw of demand: when price rises, quantity demanded falls (other things equal). Law of supply: when price rises, quantity supplied rises. Equilibrium is where demand = supply. Shortage: price below equilibrium. Surplus: price above.\nDemand shifts with income, tastes, price of substitutes/complements, population. Supply shifts with costs, technology, taxes, subsidies, number of sellers.\nPrice elasticity of demand (PED) = % change in quantity demanded / % change in price. PED>1 elastic, <1 inelastic. Example: price up 10%, quantity down 20% gives PED = 2 (elastic).\n\n## Other key ideas\nGDP: total value of goods and services made in a country in a year. Inflation: general rise in prices (measured by CPI). Unemployment rate = unemployed / labour force x 100. Real value = nominal value adjusted for inflation. Monetary policy: central bank changes interest rates. Fiscal policy: government changes taxes and spending. Comparative advantage: a country should produce what it gives up least to produce (lowest opportunity cost). Market failure: externalities, public goods, monopoly. Types of cost: fixed, variable, total = fixed + variable, average = total / quantity. Profit = revenue - cost. Marginal means \"one extra unit\".\n"}, {"f": "humanities_english_it.md", "t": "# History, geography, English, computing, business\n## History (key ideas)\nAncient civilisations: Egypt, Mesopotamia, Indus Valley, China, Greece, Rome. Middle Ages: feudalism, Silk Road trade. Renaissance (1300s-1600s): art and science revival. Industrial Revolution (from 1760s): factories and steam. World War 1 (1914-1918), World War 2 (1939-1945). Cold War (1947-1991). Sri Lanka: independence from Britain in 1948; Anuradhapura and Polonnaruwa were ancient kingdoms. India independent 1947. The internet became public in the 1990s.\n## Geography\nContinents: Africa, Antarctica, Asia, Australia/Oceania, Europe, North America, South America. Oceans: Pacific, Atlantic, Indian, Southern, Arctic. Rock cycle: igneous, sedimentary, metamorphic. Plate tectonics cause earthquakes and volcanoes. Water cycle: evaporation, condensation, precipitation, collection. Climate zones: tropical, dry, temperate, polar. Population = births - deaths + migration.\n## English\nParts of speech: noun, verb, adjective, adverb, pronoun, preposition, conjunction. A sentence needs a subject and a verb. Paragraph structure (PEEL): Point, Evidence, Explain, Link. Essay: introduction, body paragraphs, conclusion. Techniques: simile (\"like\"), metaphor, personification, alliteration, onomatopoeia. Apostrophes show ownership (the dog's bone) or missing letters (don't). Their/there/they're; your/you're; its/it's (it is).\n## Computing and ICT\nHardware: CPU (processes), RAM (short-term memory), storage (SSD/HDD), GPU (graphics). Binary uses 0 and 1; 8 bits = 1 byte. Algorithm = step-by-step instructions. Variables, loops, conditions and functions are the basic building blocks. Internet vs web: the internet is the network, the web is websites on it. Passwords should be long and unique. Backups protect data.\n## Business and accounting\nProfit = revenue - costs. Assets = liabilities + equity. Gross profit = sales - cost of goods sold. Break-even = fixed costs / (price - variable cost per unit). Simple interest = P x r x t. Marketing mix: product, price, place, promotion.\n"}, {"f": "maths.md", "t": "# Maths (primary to school level)\n## Arithmetic and number\nOrder of operations (BIDMAS/BODMAS): Brackets, Indices/Orders, Division and Multiplication, Addition and Subtraction. 2 + 3 x 4 = 14. Fractions: add by common denominator (1/2 + 1/3 = 5/6); multiply tops and bottoms; divide by flipping the second. Percentages: 15% of 80 = 0.15 x 80 = 12. Percentage change = (new - old) / old x 100. Ratio 3:2 of 25 = 15 and 10. Prime numbers have exactly 2 factors (2, 3, 5, 7, 11...). HCF = biggest shared factor, LCM = smallest shared multiple.\n## Algebra\nSolve equations by doing the same to both sides. 3x + 5 = 20: subtract 5 gives 3x = 15, divide by 3 gives x = 5. Expand: (x + 2)(x + 3) = x^2 + 5x + 6. Factorise x^2 + 5x + 6 = (x + 2)(x + 3). Quadratic formula for ax^2 + bx + c = 0: x = (-b +/- sqrt(b^2 - 4ac)) / 2a. Straight line y = mx + c (m gradient, c y-intercept). Gradient = (y2 - y1)/(x2 - x1). Simultaneous equations: eliminate one letter by adding/subtracting.\n## Geometry and measures\nArea: rectangle l x w; triangle 1/2 x b x h; circle pi r^2. Circumference 2 pi r. Volume: cuboid l x w x h; cylinder pi r^2 h. Angles: triangle 180, straight line 180, around a point 360, quadrilateral 360. Pythagoras: a^2 + b^2 = c^2 (c the longest side). Trigonometry SOH CAH TOA: sin = opp/hyp, cos = adj/hyp, tan = opp/adj.\n## Statistics and probability\nMean = total / count; median = middle value; mode = most common; range = max - min. Probability = favourable / total outcomes (between 0 and 1). Independent events multiply: two heads = 1/2 x 1/2 = 1/4.\n## Calculus (older students)\nDifferentiate: d/dx x^n = n x^(n-1). So d/dx 3x^2 = 6x. Integrate: x^n becomes x^(n+1)/(n+1) + C. Derivative = gradient of a curve; integral = area under a curve.\n## Method for any word problem\nRead twice, write what you know, choose the formula, show each step, check the answer makes sense, include units.\n"}, {"f": "minecraft.md", "t": "# Minecraft\n## Versions (2026)\nIn 2026 Minecraft changed to year-based version numbers: 26.1 is the first drop of 2026, 26.2 the second, hotfixes add a third number (26.2.1). Java 26.1 \"Tiny Takeover\" came out March 24 2026 and needs Java 25. Java 26.2 \"Chaos Cubed\" came out June 16 2026 (sulfur caves, sulfur cube mob). Bedrock numbers differ (for example 26.32 in late June 2026). A third 2026 drop (26.3) was in snapshot testing in summer 2026. Because this note is offline, the newest version may be newer: check minecraft.net.\nJava Edition is PC only (Windows, Mac, Linux) with the biggest mod scene. Bedrock runs on Windows, consoles and phones and uses add-ons. Buying on minecraft.net gives Java and Bedrock for PC together.\n## Survival start\nDay 1: punch trees for logs, make planks, a crafting table (4 planks in 2x2), then a wooden pickaxe, then stone tools. Build a shelter or dig into a hill before night. Make a bed (3 wool + 3 planks) to skip night and set your spawn. Find coal for torches (coal over stick) because monsters spawn in the dark. Cook food in a furnace. Mine iron, then diamonds low down (around layer -59). Creepers explode: hit and back away. Never dig straight down; keep water near lava.\n## Redstone\nRedstone dust carries power up to 15 blocks. Sources: lever, button, pressure plate, redstone torch. Repeater boosts signal and adds delay. Piston pushes, sticky piston pulls. Comparator reads containers. Observer detects block changes. Simple door: pressure plate -> redstone dust -> piston-driven door.\n## Commands (cheats on)\n/gamemode creative or survival; /time set day; /weather clear; /give @s diamond 10; /tp @s x y z; /locate structure village; /setworldspawn; /gamerule keepInventory true; /fill and /clone for building.\n## Multiplayer, mods and safety\nOnly get mods from trusted sites such as Modrinth and CurseForge; match the Minecraft version and the loader (Fabric, Forge, NeoForge). Do not download \"free Minecraft\" or \"free skins\" from random sites. Join only servers you trust, use chat filters and parental settings (Microsoft family safety), and never share personal info. \n"}, {"f": "online_safety_and_ratings.md", "t": "# Staying safe online\n## Never share\nPasswords, home address, school name, phone number, real full name, photos of yourself, bank details, or one-time codes. Use a different long password for every account and turn on 2-step verification.\n## Signs of an unsafe or fake website\nAsks for password or payment for something \"free\"; \"you won!\" pop-ups; misspelled address (robIox.com, mincraft.net); no padlock or https; countdown timers pushing you to hurry; forces you to download a file; asks you to turn off antivirus; unknown \"cheat\", \"generator\", \"crack\" or \"free premium\" sites. Piracy and cracked-game sites are the most common way PCs get malware.\n## Better sources\nOfficial sites only: roblox.com, minecraft.net, store.steampowered.com, microsoft.com, apple.com, google.com/play, wikipedia.org, khanacademy.org, bbc.co.uk/bitesize, britannica.com, nationalgeographic.com, commonsensemedia.org. Check a site: Who owns it? Is there an about page and contact? Are the facts shown elsewhere? Is it selling something? Is the address spelled exactly right?\n## Site and app ratings (how to check)\nCommon Sense Media (commonsensemedia.org) gives age ratings and reviews for games, apps, books and shows. ESRB (US): E, E10+, T (13+), M (17+), AO (18+). PEGI (Europe): 3, 7, 12, 16, 18. Google Play and App Store show age ratings. For websites check reviews from several places, for example Trustpilot, Google Safe Browsing (transparencyreport.google.com/safe-browsing/search), and VirusTotal for suspicious links or files.\n## Games for older audiences (not for young children)\nRated M/17+ or PEGI 16/18: Grand Theft Auto series, Call of Duty (most), Mortal Kombat, The Last of Us, Resident Evil, Dead by Daylight, Cyberpunk 2077, Red Dead Redemption, God of War (2018+), Doom. Horror and shooter games can be scary or violent. Always check the rating on the store page.\nChild-friendlier examples (E/E10+/PEGI 3-7): Minecraft (E10+), Mario and Zelda games, Pokemon, Animal Crossing, Kirby, Sonic, Rocket League (E), LEGO games. Online games with open chat (Roblox, Fortnite, Minecraft servers) need chat settings checked even when the game itself is fine.\n## Books\nAge ranges: picture books (3-7), early readers (6-9), middle grade (8-12), Young Adult YA (12+, may include mature themes), adult (16+). Check the publisher age range and Common Sense Media. Books often challenged for mature themes: some YA and adult titles discuss violence, abuse or death; choose by age and ask a parent or librarian.\n## What to do when something goes wrong\nStop, don't reply, take a screenshot, block and report, tell a trusted adult, change your password if you clicked a bad link. It is never your fault if someone scams or pressures you.\n"}, {"f": "roblox.md", "t": "# Roblox\n## Playing safely (updated 2026)\nSince January 2026 Roblox requires an age check (facial age estimate, or ID for 13+) to use chat. Users go in age bands: under 9, 9-12, 13-15, 16-17, 18-20, 21+. Chat is mostly limited to the same or neighbouring age bands, and chat is off by default for under 9 unless a parent agrees. In June 2026 Roblox rolled out \"Roblox Kids\" and \"Roblox Select\" account types worldwide for under 16s, which set content and chat by age. Parents can link accounts in Parental Controls to limit chat, block games, set spending and screen-time limits, and review friends. Official safety info: about.roblox.com/safety. If anyone asks to move to another app, asks for photos or personal info, or makes you uncomfortable: stop, block and report them, and tell a trusted adult.\nScams to avoid: \"free Robux\" sites, \"Robux generators\", fake \"trade\" offers, links asking you to log in or paste a code or cookie, and \"scripts\" or \"executors\" from strangers (often malware that steals accounts). Robux only comes from Roblox's official store, gift cards or selling your own items.\n## Making games with Roblox Studio\nStudio is free. Windows: Explorer (list of objects), Properties (settings), Toolbox (free models: check them for hidden scripts), Output (errors). Script types: Script (runs on server), LocalScript (runs on the player's device), ModuleScript (shared code). Services: game:GetService(\"Players\"), \"ReplicatedStorage\", \"ServerScriptService\".\nTouch example: local part = script.Parent; part.Touched:Connect(function(hit) print(\"touched\") end)\nLeaderstats example (Script in ServerScriptService): game.Players.PlayerAdded:Connect(function(player) local ls = Instance.new(\"Folder\", player); ls.Name = \"leaderstats\"; local coins = Instance.new(\"IntValue\", ls); coins.Name = \"Coins\" end)\nRemoteEvents let a client talk to the server. Never trust the client: check important things (money, damage) on the server. Publish via File > Publish to Roblox. Roblox has rules about content for all ages; keep games friendly.\n## Popular game types (kids often play)\nObbies (obstacle courses), tycoons, simulators, roleplay/town games, tower defence, survival, horror (check the age label: some are scary), and sandbox/building games. Look at a game's content maturity label before playing.\n"}, {"f": "science.md", "t": "# Science\n## Physics\nSpeed = distance / time. Acceleration = change in speed / time. Force F = m x a (newtons). Weight = m x g (g about 9.8 m/s^2 on Earth). Momentum = m x v. Work = force x distance; Power = work / time (watts). Kinetic energy = 1/2 m v^2; gravitational potential energy = m g h. Energy cannot be created or destroyed, only transferred. Ohm's law V = I x R. Series circuit: same current; parallel: same voltage. Density = mass / volume. Pressure = force / area. Waves: speed = frequency x wavelength. Light travels about 300,000 km/s. Newton's laws: (1) objects keep their motion unless a force acts, (2) F = ma, (3) every action has an equal and opposite reaction.\n## Chemistry\nAtoms: protons (+), neutrons (0), electrons (-). Atomic number = protons. Elements are in the periodic table; metals on the left, non-metals on the right, noble gases (very unreactive) in group 8/18. Compounds are bonded elements: ionic (metal + non-metal, electrons transferred) and covalent (non-metals sharing). Acids pH below 7, alkalis above 7, neutral 7. Acid + alkali gives salt + water. Balanced equation example: 2H2 + O2 gives 2H2O. Mole: n = mass / molar mass. States: solid, liquid, gas (melting, boiling, condensing, freezing).\n## Biology\nCells: animal cells have nucleus, cytoplasm, membrane, mitochondria; plant cells also have cell wall, chloroplasts, vacuole. Photosynthesis: carbon dioxide + water, with light, gives glucose + oxygen. Respiration: glucose + oxygen gives carbon dioxide + water + energy. DNA carries genes; humans have 46 chromosomes. Food chain: producer, then consumers. Digestive system breaks food down with enzymes. Blood: red cells carry oxygen, white cells fight infection, platelets clot. Evolution happens by natural selection: individuals better suited to the environment survive and pass on genes.\n## Earth and space\nEarth orbits the Sun in about 365.25 days; the Moon orbits Earth in about 27 days. Planets in order: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune. Seasons come from Earth's tilt.\n"}, {"f": "study_skills.md", "t": "# How to solve questions and study\nMethod: (1) read the question twice, (2) underline command words, (3) write what you know, (4) pick the rule or formula, (5) work step by step, (6) check units and sense, (7) answer in a full sentence.\nCommand words: define = give the meaning; explain = give reasons; compare = similarities and differences; evaluate = weigh up pros and cons and reach a judgement; calculate = show working and the number.\nEssays: PEEL paragraphs. Memory: spaced repetition, flashcards, past papers, teach it to someone, sleep well. Break revision into 25-minute blocks with 5-minute breaks.\n"}, {"f": "extra_knowledge.md", "t": "# World knowledge\n## Countries and capitals (selection)\nSri Lanka: Sri Jayawardenepura Kotte (legislative), Colombo (commercial). India: New Delhi. Pakistan: Islamabad. Bangladesh: Dhaka. Nepal: Kathmandu. Maldives: Male. China: Beijing. Japan: Tokyo. South Korea: Seoul. Thailand: Bangkok. Indonesia: Jakarta. Australia: Canberra. New Zealand: Wellington. UK: London. France: Paris. Germany: Berlin. Italy: Rome. Spain: Madrid. Russia: Moscow. Turkey: Ankara. Egypt: Cairo. Nigeria: Abuja. South Africa: Pretoria, Cape Town, Bloemfontein. Kenya: Nairobi. USA: Washington DC. Canada: Ottawa. Mexico: Mexico City. Brazil: Brasilia. Argentina: Buenos Aires. Saudi Arabia: Riyadh. UAE: Abu Dhabi.\nBiggest countries by area: Russia, Canada, USA, China, Brazil, Australia, India. Most people: India, China, USA, Indonesia, Pakistan. Longest river: Nile or Amazon (debated). Highest mountain: Everest (8,849 m). Largest ocean: Pacific. Largest desert: Antarctica (Sahara is the largest hot desert).\n## Space\nSun is a star; light takes about 8 minutes to reach Earth. Moon landing: Apollo 11, 1969. First human in space: Yuri Gagarin 1961. Mars has the biggest volcano (Olympus Mons). A light-year is the distance light travels in a year (about 9.5 trillion km). Black holes are places where gravity is so strong that light can't escape. The Milky Way is our galaxy.\n## Human body and health basics\nHeart pumps blood; lungs swap oxygen and carbon dioxide; brain controls the body; skeleton has 206 bones (adults). Teens need about 8-10 hours of sleep. Drink water, eat fruit, vegetables, protein and whole grains, move for about 60 minutes a day. Wash hands for 20 seconds. Vaccines train the immune system. Feeling sad, anxious or stressed is common: talk to someone you trust. For emergencies call your local emergency number. First aid: for a small cut wash and cover it; for a burn cool under running water for 10-20 minutes; for choking or bleeding heavily call emergency services. Butter is not a doctor: ask a doctor for medical advice.\n## Money\nBudget: income minus spending. Save first, spend after. Interest: simple (on the start amount) or compound (interest on interest). Needs vs wants. Never share bank details or PINs. Scams: anything promising fast easy money is a scam.\n## Languages\nEnglish tips: read daily, learn words in sentences. Basic phrases: Spanish hola (hello), gracias (thank you); French bonjour, merci; Japanese konnichiwa, arigatou; Hindi namaste, dhanyavaad; Sinhala ayubowan (hello), istuti (thanks); Tamil vanakkam (hello), nandri (thanks). Learn a language with short daily practice, speaking out loud, and listening to songs and shows in it.\n## Music\nNotes A to G; a scale is notes in order; major scales sound happy, minor sound sadder. Beat = steady pulse; tempo = speed; rhythm = pattern. Chords are 3+ notes together (C major = C E G). Instrument families: strings, woodwind, brass, percussion, keyboards. Songwriting: verse, chorus, bridge; write about one clear idea. Butter can discuss, explain and help write songs but doesn't copy out copyrighted lyrics: use licensed sites such as Genius or Spotify for lyrics.\n## Sports\nFootball (soccer): 11 players each side, 90 minutes, offside rule, goals win. Cricket: two teams of 11; runs, overs (6 balls), wickets (10 per innings); formats Test, ODI, T20. Basketball: 5 players, 3-pointers. Tennis: points 15, 30, 40, game. Olympics every 4 years (Summer 2024 Paris; Winter 2026 Milan Cortina; Summer 2028 Los Angeles). FIFA World Cup 2026 was hosted by USA, Canada and Mexico.\n## Cooking\nWash hands, ask an adult before using knives and hot stoves, never leave pans unattended. Boil pasta 8-12 minutes; rice about 2 parts water to 1 part rice, simmer 12-15 minutes with lid; eggs: soft-boiled 6 minutes, hard-boiled 10 minutes. Cook chicken until no pink and juices run clear (75 C inside). Butter melts at about 32-35 C. Baking: flour, sugar, eggs, butter, baking powder.\n## Art, books and famous people\nPrimary colours (paint): red, yellow, blue. Famous: Leonardo da Vinci (Mona Lisa), Van Gogh (Starry Night), Picasso. Scientists: Newton (gravity), Einstein (relativity), Marie Curie (radioactivity), Darwin (evolution), Ada Lovelace (first programmer idea), Alan Turing (computing). Inventions: printing press (Gutenberg), telephone (Bell), light bulb (Edison, Swan), World Wide Web (Tim Berners-Lee, 1989), airplane (Wright brothers, 1903).\n## Technology and AI\nHow the internet works: devices send data in packets through routers; websites live on servers; DNS turns names into addresses. AI language models learn patterns from lots of text and predict the next word; they can be wrong, so check facts. Cybersecurity: updates, strong passwords, 2-step verification, don't click unknown links. Programming languages: Python (easy, general), JavaScript (websites), Lua (Roblox), C++ (games), Java (Minecraft Java Edition, Android).\n## Environment\nClimate change: burning fossil fuels adds greenhouse gases that warm the planet. Renewable energy: solar, wind, hydro. Reduce, reuse, recycle. Biodiversity means variety of life; rainforests and coral reefs are very rich in it.\n## Wellbeing\nEveryone has hard days. Talk to a parent, teacher or friend; take breaks from screens; sleep, move, and spend time outside. If someone is being bullied or unsafe, tell a trusted adult. If you ever feel like hurting yourself, contact a trusted adult or your local emergency or helpline number right now.\n"}];

function buildIndex(){CH=[];DF={};for(const n of NOTES)for(const p of n.t.split(/\n(?=#)/))for(let i=0;i<p.length;i+=900){const s=p.slice(i,i+900).trim();if(s.length>40)CH.push({s,w:tok(s)})}
  for(const x of learned){const s=x.t+' ('+x.s+'): '+x.x;CH.push({s,w:tok(s)})}
  CH.forEach(c=>new Set(c.w).forEach(w=>DF[w]=(DF[w]||0)+1))}

function search(q){const qw=new Set(tok(q)),n=CH.length;return CH.map(c=>({c,s:[...qw].reduce((a,w)=>{const k=c.w.filter(x=>x===w).length;return a+(k?(1+Math.log(k))*Math.log(1+n/DF[w]):0)},0)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,3)}

  if(/^[\d\s+\-*/().%]+$/.test(m)&&/\d\s*[+\-*/%]/.test(m)){try{const r=Function('"use strict";return ('+m+')')();if(isFinite(r))return m+' = '+r}catch(e){}}return null}

function md(src){return src.split('```').map((p,i,arr)=>{
  if(i%2){const n=p.indexOf('\n');return '<div class="code"><button class="cp" type="button">Copy</button><pre>'+esc(n>-1?p.slice(n+1):p)+'</pre></div>'}
  p=(i>0?p.replace(/^\n/,''):p);if(i<arr.length-1)p=p.replace(/\n$/,'');return esc(p).replace(/^### (.*)$/gm,'<h4>$1</h4>').replace(/^#{1,2} (.*)$/gm,'<h3>$1</h3>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>').replace(/`([^`\n]+)`/g,'<code>$1</code>')
   .replace(/^(?:[-*] .*(?:\n|$))+/gm,m=>'<ul>'+m.trim().split('\n').map(l=>'<li>'+l.slice(2)+'</li>').join('')+'</ul>')
   .replace(/^(?:\d+\. .*(?:\n|$))+/gm,m=>'<ol>'+m.trim().split('\n').map(l=>'<li>'+l.replace(/^\d+\. /,'')+'</li>').join('')+'</ol>')
   .replace(/<\/(ul|ol|h3|h4)>\n/g,'</$1>').replace(/\n{2,}/g,'<br><br>').replace(/\n/g,'<br>').replace(/(<br>)+(?=<(?:ul|ol|h3|h4)>)/g,'')}).join('')}

function typer(el){let full='',shown=0,done=false,raf=0,res;

  b.innerHTML='<div class="vhead"><div class="vseg">'+T.map(([k,n])=>'<button type="button" data-k="'+k+'" class="'+(k===vtab?'on':'')+'">'+n+'<small>'+by[k].length+'</small></button>').join('')+'</div><button class="btn ghost" id="lk" type="button">Lock</button></div><div id="vact" class="vtop"></div><div id="pl"></div><div id="vl"></div><p class="err" id="vmsg"></p><p class="small">Everything here, including file names and chats, is encrypted and stays inside this browser on this computer. Clearing site data erases it, so keep backups of anything important.</p>';
  b.querySelectorAll('.vseg button').forEach(x=>x.onclick=()=>{vtab=x.dataset.k;drawVault()});$('lk').onclick=lock;
  const btn=(t,f,c='btn')=>{const e=document.createElement('button');e.type='button';e.className=c;e.textContent=t;e.onclick=f;return e};
  const act=$('vact'),add=(label,accept)=>{const l=document.createElement('label');l.className='btn';l.innerHTML=label+'<input type="file" accept="'+accept+'" multiple hidden>';
    l.lastChild.onchange=async e=>{for(const f of e.target.files){vmsg('Locking '+f.name+'…');try{await addBlob(f,f.name,f.type.startsWith('audio'))}catch(err){vmsg('Could not save '+f.name+' (it may be too big for this browser).');return}}drawVault()};act.appendChild(l)};
  if(vtab==='photo')add('Add photos','image/*');
  if(vtab==='video')add('Add videos','video/*');
  if(vtab==='rec'){if(mr){act.className='';act.innerHTML='<div class="recbar"><span class="dot"></span><b id="rt">0:00</b><span class="small">Recording…</span></div>';act.firstChild.append(btn('Stop',()=>mr.stop()))}
    else{act.append(btn('Record voice',()=>startRec(false)),btn('Record screen',()=>startRec(true),'btn ghost'));add('Add audio files','audio/*')}}
  if(vtab==='chat')act.append(btn('New private chat',async()=>{gotoTab('chat');await setSpace('private');newChat()}));
  const vl=$('vl'),list=by[vtab];let dbtn=null;
  const updDel=()=>{if(dbtn)dbtn.textContent='Delete'+(vSel.size?' ('+vSel.size+')':'')};
  const togg=(el,id)=>{if(vSel.has(id)){vSel.delete(id);el.classList.remove('sel')}else{vSel.add(id);el.classList.add('sel')}updDel()};
  if(!mr&&list.length){act.append(btn(vSelMode?'Cancel':'Select',()=>{vSelMode=!vSelMode;vSel.clear();drawVault()},'btn ghost'));
    if(vSelMode){act.append(btn('Select all',()=>{const all=vSel.size===list.length;vSel.clear();if(!all)list.forEach(x=>vSel.add(x.v.id));vl.querySelectorAll('[data-id]').forEach(el=>el.classList.toggle('sel',vSel.has(+el.dataset.id)));updDel()},'btn ghost'));
      dbtn=btn('Delete',async()=>{if(!vSel.size)return;if(!await askYes('Delete '+vSel.size+' item'+(vSel.size>1?'s':'')+' forever?','This cannot be undone.','Delete'))return;
        if(vtab==='chat'){if(space==='private')await setSpace('normal');store.priv={chats:[],cur:null}}for(const id of vSel)await tx('readwrite',s=>s.delete(id));vSel.clear();vSelMode=false;drawVault()});act.append(dbtn);updDel()}}
  if(!list.length){vl.innerHTML='<p class="small">'+({photo:'No photos yet.',video:'No videos yet.',rec:'No recordings yet.',chat:'No private chats yet. Start one and it is saved here, encrypted.'}[vtab])+'</p>';return}
  if(vtab==='photo'){vl.className='pgrid';
    for(const {v,m} of list){const p=document.createElement('button');p.type='button';p.title=m.name;p.dataset.id=v.id;if(vSelMode&&vSel.has(v.id))p.className='sel';p.onclick=()=>vSelMode?togg(p,v.id):openItem(v,m);
      if(v.th){try{const u=URL.createObjectURL(new Blob([await unseal(v.thiv,v.th)],{type:'image/jpeg'}));urls.push(u);p.innerHTML='<img alt="">';p.firstChild.src=u}catch(e){p.textContent=m.name}}else p.textContent=m.name;vl.appendChild(p)}return}
  for(const {v,m} of list){const d=document.createElement('div');d.className='vid'+(vSelMode?' pick':'')+(vSelMode&&vSel.has(v.id)?' sel':'');d.dataset.id=v.id;
    d.innerHTML=(vSelMode?'<span class="cb"></span>':'')+'<b>'+esc(m.name||'file')+'</b><span class="small">'+(vtab==='chat'?new Date(v.added).toLocaleDateString():(v.size/1048576).toFixed(1)+' MB')+'</span>';
    if(vSelMode)d.onclick=()=>togg(d,v.id);else d.append(btn(vtab==='chat'?'Open':'Play',()=>vtab==='chat'?openChat(v):openItem(v,m)),btn('Delete',()=>delItem(v,m),'btn ghost'));vl.appendChild(d)}}
/* ---------- SAVING: automatic and silent (no permission pop-ups), plus one-click backups ---------- */
let NOSTORE=false;try{localStorage.setItem('butter-t','1');localStorage.removeItem('butter-t')}catch(e){NOSTORE=true}
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const fsdb=new Promise((ok,no)=>{try{const r=indexedDB.open('butter-fs',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}});fsdb.catch(()=>{});
const fsget=async k=>{const d=await fsdb;return new Promise((ok,no)=>{const r=d.transaction('h').objectStore('h').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})};
const fsput=async(k,v)=>{const d=await fsdb;return new Promise((ok,no)=>{const r=d.transaction('h','readwrite').objectStore('h').put(v,k);r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})};
async function flushData(){try{const o={v:1,savedAt:+ls.get('butter-savedAt')||Date.now(),data:{}};for(const k of PERSIST){const v=ls.get(k);if(v!==null&&v!==undefined)o.data[k]=v}await fsput('snap',o)}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(flushT);flushData()}});
function mergeData(o,force){if(!o||!o.data)return false;const d=o.data,mine=+ls.get('butter-savedAt')||0,fold=+o.savedAt||0;let ch=false;restoring=true;
  const P=(s,def)=>{try{return JSON.parse(s||def)}catch(e){return JSON.parse(def)}};
  const cm=new Map();for(const c of P(ls.get('butter-chats'),'[]'))cm.set(c.id,c);let cch=false;
  for(const c of P(d['butter-chats'],'[]')){const m=cm.get(c.id);if(!m||(c.msgs||[]).length>(m.msgs||[]).length){cm.set(c.id,c);cch=true}}
  if(cch){ls.set('butter-chats',JSON.stringify([...cm.values()].sort((a,b)=>b.id-a.id).slice(0,40)));ch=true}
  const gm=new Map(P(ls.get('butter-groups'),'[]').map(g=>[g.id,g]));let gch=false;for(const g of P(d['butter-groups'],'[]'))if(g&&g.id&&!gm.has(g.id)){gm.set(g.id,g);gch=true}
  if(gch){ls.set('butter-groups',JSON.stringify([...gm.values()]));ch=true}
  const lm=new Map(P(ls.get('butter-learned'),'[]').map(x=>[x.k,x]));let lch=false;for(const x of P(d['butter-learned'],'[]'))if(x&&x.k&&!lm.has(x.k)){lm.set(x.k,x);lch=true}
  if(lch){ls.set('butter-learned',JSON.stringify([...lm.values()].sort((a,b)=>b.d-a.d).slice(0,300)));ch=true}
  if(force||fold>mine)for(const k of['butter-set','butter-theme','butter-mode','butter-lite','butter-learn-ok'])if(d[k]!==undefined&&ls.get(k)!==d[k]){ls.set(k,d[k]);ch=true}
  ls.set('butter-savedAt',String(Math.max(mine,fold)));restoring=false;return ch}
function reloadFromStore(){S={...DEF,...JSON.parse(ls.get('butter-set')||'{}')};groups=JSON.parse(ls.get('butter-groups')||'[]');learned=JSON.parse(ls.get('butter-learned')||'[]');buildIndex();
  setTheme(THEMES.includes(ls.get('butter-theme'))?ls.get('butter-theme'):'dark');setMode(['fast','balanced','deep'].includes(ls.get('butter-mode'))?ls.get('butter-mode'):'balanced');setLite(ls.get('butter-lite')==='1');populateBrains();
  const nc=JSON.parse(ls.get('butter-chats')||'[]');if(space==='private')store.normal={chats:nc,cur:nc[0]||null};else{chats=nc;cur=chats[0]||null;if(!cur)newChat();else{renderList();render()}}}

const dAgo=t=>Math.floor((Date.now()-t)/864e5);
function setSaveChip(){const c=$('savechip'),lb=+ls.get('butter-lastbackup')||0;let t,k;
  if(NOSTORE){t='Not saving';k='warn'}else if(!lb){t='Back up now';k='need'}else{const d=dAgo(lb);t=d<7?'Backed up '+(d<1?'today':d+'d ago'):'Back up ('+d+'d)';k=d<7?'ok':'warn'}
  c.textContent=t;c.className='chip '+k;c.title='Click to download a backup of your chats, settings and vault';refreshSaveInfo()}
async function refreshSaveInfo(){const el=$('saveInfo');if(!el)return;const lb=+ls.get('butter-lastbackup')||0;
  let t=NOSTORE?'This page cannot save anything. Open it in a normal window.':'Butter saves automatically. If the laptop is reset, only a backup file can bring everything back, so keep one somewhere safe (a USB stick or cloud drive). Backups include your vault files.';
  t+=lb?' Last backup: '+new Date(lb).toLocaleDateString()+'.':' You have not made a backup yet.';
  try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate(),p=navigator.storage.persisted?await navigator.storage.persisted():false;t+=' Storage used: '+(e.usage/1073741824).toFixed(2)+' GB'+(p?' (protected from automatic cleanup).':'.')}}catch(e){}
  el.textContent=t}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
async function backupNow(){try{toast('Packing your backup…');const o={v:2,savedAt:+ls.get('butter-savedAt')||Date.now(),data:{},vault:null},parts=[];for(const k of PERSIST){const v=ls.get(k);if(v!==null&&v!==undefined)o.data[k]=v}
  let cfg=null;try{cfg=await tx('readonly',s=>s.get('cfg'),'meta')}catch(e){}
  if(cfg){o.vault={cfg:{salt:b64(cfg.salt),chk:cfg.chk},recs:[]};
    for(const id of await tx('readonly',s=>s.getAllKeys())){const r=await tx('readonly',s=>s.get(id));if(!r)continue;
      o.vault.recs.push({id:r.id,kind:r.kind,size:r.size,added:r.added,iv:b64(r.iv),miv:b64(r.miv),thiv:r.thiv?b64(r.thiv):null,l:[r.data.byteLength,r.meta.byteLength,r.th?r.th.byteLength:0]});parts.push(r.data,r.meta);if(r.th)parts.push(r.th)}}
  const h=new TextEncoder().encode(JSON.stringify(o)),len=new Uint8Array(4);new DataView(len.buffer).setUint32(0,h.length);
  download(new Blob([len,h,...parts]),'butter-backup-'+new Date().toISOString().slice(0,10)+'.butter');ls.set('butter-lastbackup',String(Date.now()));setSaveChip();toast('Backup saved to your Downloads folder.')}
  catch(e){toast('Could not make the backup.')}}
async function restoreBackup(f){let o,off=0;const bin=!f.name.toLowerCase().endsWith('.json');
  if(bin){const hl=new DataView(await f.slice(0,4).arrayBuffer()).getUint32(0);o=JSON.parse(await f.slice(4,4+hl).text());off=4+hl}else o=JSON.parse(await f.text());
  const ch=mergeData(o,true);let n=0,note='';
  if(bin&&o.vault&&o.vault.cfg){const lc=await tx('readonly',s=>s.get('cfg'),'meta');
    if(lc&&lc.chk!==o.vault.cfg.chk)note=' The backup vault has a different password, so its files were skipped.';
    else{if(!lc)await tx('readwrite',s=>s.put({id:'cfg',salt:unb64(o.vault.cfg.salt),chk:o.vault.cfg.chk}),'meta');
      const have=new Set(await tx('readonly',s=>s.getAllKeys()));
      for(const r of o.vault.recs){const[a,b,c]=r.l;if(!have.has(r.id)){const rec={id:r.id,kind:r.kind,size:r.size,added:r.added,iv:unb64(r.iv),miv:unb64(r.miv),thiv:r.thiv?unb64(r.thiv):null,data:await f.slice(off,off+a).arrayBuffer(),meta:await f.slice(off+a,off+a+b).arrayBuffer(),th:c?await f.slice(off+a+b,off+a+b+c).arrayBuffer():null};await tx('readwrite',s=>s.put(rec));n++}off+=a+b+c}}}
  reloadFromStore();touch();if($('vault').classList.contains('on')&&!KEY)drawVault();toast((ch||n?'Backup restored'+(n?' ('+n+' vault files)':''):'Nothing new in that backup')+'.'+note)}
$('saveBackup').onclick=backupNow;$('savechip').onclick=backupNow;
$('saveRestore').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{await restoreBackup(f)}catch(err){toast('That file is not a Butter backup.')}};
(async()=>{try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
    const wiped=!ls.get('butter-chats')&&!ls.get('butter-set'),snap=await fsget('snap').catch(()=>null);
    if(wiped&&snap&&snap.data&&Object.keys(snap.data).length&&mergeData(snap,true)){reloadFromStore();toast('Restored your chats and settings.')}}catch(e){}finally{booting=false}
  setSaveChip();
  setTimeout(()=>{const lb=+ls.get('butter-lastbackup')||0;if((chats.length>=3||learned.length>0)&&(!lb||dAgo(lb)>=7))toast('Tip: tap the Backup button in the sidebar to save a copy of your data.')},7000)})();
